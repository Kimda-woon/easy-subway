<!doctype html>
<html lang="ko" class="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1b4fd8">
  <title>쉬운 지하철</title>
  <meta name="description" content="지하철 길 안내: 어느 호선, 어느 방향, 어디서 갈아타는지 알려드려요.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="쉬운 지하철">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <!-- 스타일이 붙기 전에 깜빡이지 않게 잠깐 숨긴다 (자바스크립트가 꺼져 있으면 바로 보인다) -->
  <style>html.loading body { visibility: hidden; }</style>
  <noscript><style>html.loading body { visibility: visible; }</style></noscript>
</head>
<body>
  <header class="top">
    <h1>🚇 쉬운 지하철</h1>
    <div class="size" role="group" aria-label="글자 크기">
      <button type="button" data-scale="1" aria-label="보통 글자">가</button>
      <button type="button" data-scale="1.25" class="m" aria-label="큰 글자">가</button>
      <button type="button" data-scale="1.5" class="l" aria-label="아주 큰 글자">가</button>
    </div>
  </header>

  <noscript><p style="padding:1rem;font-size:1.2rem">이 앱은 자바스크립트가 켜져 있어야 써요. 브라우저 설정을 확인해 주세요.</p></noscript>

  <main>
    <section id="finder" class="card">
      <div class="field">
        <label for="from">어디서 타세요?</label>
        <input id="from" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="역 이름 (예: 왕십리)" enterkeyhint="next">
        <ul id="from-list" class="suggest" hidden></ul>
      </div>

      <button id="swap" type="button" class="ghost">⇅ 출발·도착 바꾸기</button>

      <div class="field">
        <label for="to">어디로 가세요?</label>
        <input id="to" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="역 이름 (예: 돌곶이)" enterkeyhint="go">
        <ul id="to-list" class="suggest" hidden></ul>
      </div>

      <p id="msg" class="msg" role="alert" hidden></p>
      <button id="go" type="button" class="primary">길 알려주세요</button>

      <div id="recent" hidden>
        <h2>최근에 찾은 길</h2>
        <div id="recent-list"></div>
      </div>
    </section>

  </main>

  <!-- 결과 화면: 입력 화면 위에 따로 뜬다. 갈아타는 횟수와 상관없이 모든 단계를 한 화면에 보여 준다. -->
  <div id="result" hidden role="dialog" aria-label="가는 길">
    <div class="rv-top">
      <button id="rv-back" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        다시 찾기
      </button>
    </div>
    <div id="rv-stage" aria-live="polite"></div>
  </div>


  <!-- 앱 파일 불러오기: 먼저 항상 최신인 version.json 을 확인하고, 그 번호를 붙여 불러온다.
       그래서 이 index.html 이 폰에 옛 것으로 남아 있어도 앱 코드와 스타일은 늘 최신이다.
       앱을 고칠 때는 version.json 의 v 값만 바꾸면 된다. -->
  <script>
  (function () {
    var FALLBACK = '20261007d', started = false;
    function show() { document.documentElement.classList.remove('loading'); }
    function start(v) {
      if (started) return;
      started = true;
      var css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = 'style.css?v=' + v;
      css.onload = show; css.onerror = show;
      document.head.appendChild(css);
      ['data.js', 'router.js', 'app.js'].forEach(function (f) {
        var s = document.createElement('script');
        s.src = f + '?v=' + v; s.async = false;     // 순서대로 실행
        document.body.appendChild(s);
      });
      setTimeout(show, 3000);                       // 무슨 일이 있어도 화면은 보이게
    }
    var timer = setTimeout(function () { start(FALLBACK); }, 2500);
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) { clearTimeout(timer); start(String((j && j.v) || FALLBACK)); })
      .catch(function () { clearTimeout(timer); start(FALLBACK); });
  })();
  </script>
</body>
</html>
